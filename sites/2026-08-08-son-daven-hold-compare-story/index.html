<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Son Daven 風 表現デモ — シネマティックローダー / 章立てスクロール / 長押し比較</title>
<style>
  :root{
    --bg:#0e0d0a;
    --fg:#f4efe4;
    --muted:#a89f8c;
    --accent:#c98a4b;
    --line:rgba(244,239,228,0.16);
    --forest-1:#25301f;
    --forest-2:#3c4a2a;
    --snow-1:#dfe6ea;
    --snow-2:#aab8c2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:"Helvetica Neue",Arial,"Hiragino Sans","Yu Gothic",sans-serif;
    overflow-x:hidden;
  }
  a{color:inherit;}

  /* ---------- 1. シネマティック・プリローダー ---------- */
  #loader{
    position:fixed; inset:0; z-index:1000;
    background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:transform 0.9s cubic-bezier(.76,0,.24,1);
  }
  #loader.is-done{ transform:translateY(-100%); }
  #loader .count{
    font-size:clamp(3rem,10vw,7rem);
    font-weight:200; letter-spacing:0.04em;
    font-variant-numeric:tabular-nums;
  }
  #loader .label{
    margin-top:0.5rem; font-size:0.75rem; letter-spacing:0.35em;
    text-transform:uppercase; color:var(--muted);
  }
  #loader .bar{
    width:min(260px,60vw); height:1px; background:var(--line);
    margin-top:2rem; position:relative; overflow:hidden;
  }
  #loader .bar-fill{
    position:absolute; left:0; top:0; bottom:0; width:0%;
    background:var(--accent);
  }

  section{ position:relative; padding:0 6vw; }

  /* ---------- 2. ヒーロー(パララックス) ---------- */
  #hero{
    height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; overflow:hidden;
  }
  #hero .layer{
    position:absolute; inset:-10% -10%;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(201,138,75,0.25), transparent 55%),
      linear-gradient(180deg, var(--forest-1), var(--bg) 80%);
    will-change:transform;
  }
  #hero .layer.mid{ opacity:0.6; mix-blend-mode:screen; }
  #hero h1{
    position:relative; margin:0; font-weight:200; letter-spacing:0.06em;
    font-size:clamp(2.4rem,8vw,6rem);
  }
  #hero p{
    position:relative; margin:1rem 0 0; color:var(--muted);
    letter-spacing:0.3em; text-transform:uppercase; font-size:0.75rem;
  }
  #hero .scroll-cue{
    position:absolute; bottom:2.5rem; left:50%; transform:translateX(-50%);
    font-size:0.7rem; letter-spacing:0.3em; color:var(--muted); text-transform:uppercase;
  }

  /* ---------- 3. 章立てスクロール(ピン留め) ---------- */
  .chapters-spacer{ height:400vh; }
  .chapters-pin{
    position:sticky; top:0; height:100vh;
    display:flex; align-items:center; gap:6vw;
  }
  .chapters-visual{
    flex:1 1 45%; height:60vh; border-radius:2px; position:relative; overflow:hidden;
    background:linear-gradient(160deg,var(--forest-2),var(--forest-1));
  }
  .chapters-visual::after{
    content:""; position:absolute; inset:0;
    background:radial-gradient(circle at 70% 30%, rgba(255,255,255,0.15), transparent 60%);
    opacity:var(--chapter-glow,0.4);
    transition:opacity 0.6s ease;
  }
  .chapters-text{ flex:1 1 45%; }
  .chapters-text .chapter-index{
    color:var(--accent); letter-spacing:0.3em; font-size:0.75rem; text-transform:uppercase;
  }
  .chapters-text h2{
    font-weight:200; font-size:clamp(1.8rem,4vw,3.2rem); margin:0.6rem 0;
  }
  .chapters-text p{ color:var(--muted); line-height:1.9; max-width:32ch; }
  .chapters-dots{
    position:absolute; right:6vw; top:50%; transform:translateY(-50%);
    display:flex; flex-direction:column; gap:0.9rem;
  }
  .chapters-dots span{
    width:6px; height:6px; border-radius:50%; background:var(--line);
    transition:background 0.4s ease, transform 0.4s ease;
  }
  .chapters-dots span.is-active{ background:var(--accent); transform:scale(1.4); }

  /* ---------- 4. 長押しで四季比較 ---------- */
  #compare{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding-top:8vh; padding-bottom:8vh; }
  #compare h2{ font-weight:200; font-size:clamp(1.6rem,3.6vw,2.6rem); margin:0 0 0.5rem; }
  #compare .hint{ color:var(--muted); font-size:0.85rem; margin-bottom:2.5rem; letter-spacing:0.05em; }
  .compare-frame{
    position:relative; width:min(760px,90vw); height:min(460px,56vw);
    border-radius:2px; overflow:hidden; cursor:pointer;
    user-select:none; -webkit-user-select:none;
    box-shadow:0 30px 60px rgba(0,0,0,0.45);
  }
  .compare-base, .compare-reveal{
    position:absolute; inset:0; display:flex; align-items:flex-end; padding:2rem;
  }
  .compare-base{
    background:linear-gradient(160deg,var(--forest-2),var(--forest-1) 70%);
  }
  .compare-reveal{
    background:linear-gradient(160deg,var(--snow-1),var(--snow-2) 70%);
    color:#1c2226;
    clip-path:inset(0 100% 0 0);
  }
  .compare-frame .season-label{
    font-size:0.75rem; letter-spacing:0.3em; text-transform:uppercase;
  }
  .compare-progress{
    position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--accent);
    transform:translateX(0%);
  }
  .compare-frame .press-ring{
    position:absolute; left:50%; top:50%; width:64px; height:64px; margin:-32px 0 0 -32px;
    border-radius:50%; border:1px solid rgba(244,239,228,0.5);
    display:flex; align-items:center; justify-content:center;
    font-size:0.65rem; letter-spacing:0.15em; text-transform:uppercase;
    opacity:0.85; pointer-events:none;
  }
  .compare-frame .press-ring::before{
    content:""; position:absolute; inset:-1px; border-radius:50%;
    border:2px solid var(--accent);
    clip-path:inset(0 calc(100% - var(--hold,0)*100%) 0 0);
  }

  /* ---------- 5. ロケーションカード ---------- */
  #locations{ padding:14vh 6vw; }
  #locations h2{ font-weight:200; font-size:clamp(1.6rem,3.6vw,2.6rem); margin:0 0 3rem; }
  .loc-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1px;
    background:var(--line);
  }
  .loc-card{
    background:var(--bg); padding:2rem 1.6rem; min-height:220px;
    display:flex; flex-direction:column; justify-content:space-between;
    transition:background 0.4s ease;
  }
  .loc-card:hover{ background:#17150f; }
  .loc-card .n{ color:var(--accent); font-size:0.75rem; letter-spacing:0.2em; }
  .loc-card h3{ font-weight:300; margin:1rem 0 0.4rem; }
  .loc-card p{
    color:var(--muted); font-size:0.85rem; line-height:1.7; margin:0;
    max-height:0; overflow:hidden; opacity:0;
    transition:max-height 0.5s ease, opacity 0.5s ease;
  }
  .loc-card:hover p{ max-height:8em; opacity:1; }

  footer{ padding:4rem 6vw; color:var(--muted); font-size:0.75rem; letter-spacing:0.1em; }
</style>
</head>
<body>

  <div id="loader">
    <div class="count">0%</div>
    <div class="label">Son Daven — 表現再現デモ</div>
    <div class="bar"><div class="bar-fill"></div></div>
  </div>

  <section id="hero">
    <div class="layer back"></div>
    <div class="layer mid"></div>
    <h1>SON DAVEN</h1>
    <p>A place of power in the Carpathians</p>
    <div class="scroll-cue">Scroll</div>
  </section>

  <section class="chapters-spacer">
    <div class="chapters-pin">
      <div class="chapters-visual"></div>
      <div class="chapters-text">
        <div class="chapter-index">01 / 04</div>
        <h2>Prologue</h2>
        <p>フチュル文化と現代建築が交差する、カルパティア山脈の新しい聖域。</p>
      </div>
      <div class="chapters-dots">
        <span class="is-active"></span><span></span><span></span><span></span>
      </div>
    </div>
  </section>

  <section id="compare">
    <h2>Summer / Winter</h2>
    <p class="hint">画像を長押し(または長押しタップ)すると、夏の景色から冬の景色へゆっくり切り替わります</p>
    <div class="compare-frame" id="compareFrame">
      <div class="compare-base"><span class="season-label">Summer</span></div>
      <div class="compare-reveal"><span class="season-label">Winter</span></div>
      <div class="compare-progress"></div>
      <div class="press-ring">Hold</div>
    </div>
  </section>

  <section id="locations">
    <h2>Around Son Daven</h2>
    <div class="loc-grid" id="locGrid"></div>
  </section>

  <footer>
    学習用の再現デモです。実サイト(sondaven.com)のコード・画像・文章は使用していません。
  </footer>

<script>
/* =========================================================================
 * 1. initPreloader(onDone)
 *    0→100% のカウンターとバーを走らせ、完了後にローダーを上へスライドさせて消す。
 *    「シネマティックなローダー」演出の最小実装。他ページでもそのままコピー可。
 * ======================================================================= */
function initPreloader(onDone){
  const loader = document.getElementById('loader');
  const countEl = loader.querySelector('.count');
  const barFill = loader.querySelector('.bar-fill');
  let value = 0;
  document.body.style.overflow = 'hidden'; // 読み込み中はスクロールさせない
  const timer = setInterval(() => {
    // 進むほど増分を小さくして「終盤でじわじわ止まる」体感速度にする
    value += Math.max(1, (100 - value) / 10);
    if (value >= 100) value = 100;
    countEl.textContent = Math.floor(value) + '%';
    barFill.style.width = value + '%';
    if (value >= 100) {
      clearInterval(timer);
      setTimeout(() => {
        loader.classList.add('is-done');
        document.body.style.overflow = '';
        if (onDone) onDone();
      }, 250);
    }
  }, 40);
}

/* =========================================================================
 * 2. initParallax(el, layers)
 *    layers = [{el, speed}] のリストを受け取り、スクロール量 × speed だけ
 *    各レイヤーを縦方向にずらす。speed が小さいほど手前より遅れて動く
 *    (視差 = パララックス)。requestAnimationFrame で毎フレーム同期する。
 * ======================================================================= */
function initParallax(layers){
  function tick(){
    const y = window.scrollY;
    layers.forEach(({el, speed}) => {
      el.style.transform = `translate3d(0, ${y * speed}px, 0)`;
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* =========================================================================
 * 3. getScrollProgress(spacerEl)
 *    高さを大きく確保した spacer 要素が画面を通過する割合を 0〜1 で返す。
 *    中身側は position:sticky で画面に固定し、この値でアニメーションを
 *    進めることで「スクロールにピン留めしながら演出する」表現の土台になる。
 * ======================================================================= */
function getScrollProgress(spacerEl){
  const rect = spacerEl.getBoundingClientRect();
  const total = rect.height - window.innerHeight;
  if (total <= 0) return 0;
  const progress = -rect.top / total;
  return Math.min(1, Math.max(0, progress));
}

/* =========================================================================
 * 4. initChapterScroll()
 *    章(chapter)データを progress 区間ごとに割り当て、スクロール位置が
 *    どの区間にいるかで見出し・本文・ドットのアクティブ状態を切り替える。
 *    ピン留めセクション内で「複数の場面が順番に入れ替わる」演出の基本形。
 * ======================================================================= */
function initChapterScroll(){
  const spacer = document.querySelector('.chapters-spacer');
  const indexEl = document.querySelector('.chapter-index');
  const titleEl = document.querySelector('.chapters-text h2');
  const bodyEl = document.querySelector('.chapters-text p');
  const visual = document.querySelector('.chapters-visual');
  const dots = document.querySelectorAll('.chapters-dots span');

  const chapters = [
    { title: 'Prologue', body: 'フチュル文化と現代建築が交差する、カルパティア山脈の新しい聖域。' },
    { title: 'Architecture', body: '地形に寄り添う低層のヴォリュームと、地元の木材・石を用いた素材構成。' },
    { title: 'Typologies', body: '森を望む一棟建てのアパートメントから、家族向けの複合タイプまで。' },
    { title: 'Seasons', body: '夏は緑の渓谷、冬は雪に覆われたスロープ。四季で表情を変える滞在体験。' },
  ];

  let lastIndex = -1;
  function update(){
    const progress = getScrollProgress(spacer);
    const idx = Math.min(chapters.length - 1, Math.floor(progress * chapters.length));
    if (idx !== lastIndex){
      lastIndex = idx;
      const ch = chapters[idx];
      indexEl.textContent = String(idx + 1).padStart(2, '0') + ' / ' + String(chapters.length).padStart(2, '0');
      titleEl.textContent = ch.title;
      bodyEl.textContent = ch.body;
      dots.forEach((d, i) => d.classList.toggle('is-active', i === idx));
    }
    // 区間内の局所的な進み具合(0〜1)で光の強さを変化させ、単調な切り替わりに揺らぎを足す
    const local = (progress * chapters.length) % 1;
    visual.style.setProperty('--chapter-glow', (0.25 + local * 0.4).toFixed(2));
    requestAnimationFrame(update);
  }
  requestAnimationFrame(update);
}

/* =========================================================================
 * 5. initHoldCompare(frameEl, {duration})
 *    マウス/タッチで「押し続けている間」だけ .compare-reveal の clip-path を
 *    広げていき、指を離すと元に戻す「長押しビフォーアフター」インタラクション。
 *    press-ring 側の --hold カスタムプロパティも同期させ、リング上に進捗を表示する。
 * ======================================================================= */
function initHoldCompare(frameEl, { duration = 1400 } = {}){
  const reveal = frameEl.querySelector('.compare-reveal');
  const progressLine = frameEl.querySelector('.compare-progress');
  const ring = frameEl.querySelector('.press-ring');

  let holding = false;
  let startTime = 0;
  let current = 0; // 0〜1

  function setAmount(v){
    current = Math.min(1, Math.max(0, v));
    reveal.style.clipPath = `inset(0 ${(1 - current) * 100}% 0 0)`;
    progressLine.style.transform = `translateX(${current * 100}%)`;
    ring.style.setProperty('--hold', current.toFixed(3));
  }

  function frame(now){
    if (holding){
      const elapsed = now - startTime;
      setAmount(elapsed / duration);
      if (current < 1) requestAnimationFrame(frame);
    } else {
      // 離したら現在値から少しずつ 0 へ戻す
      setAmount(current - 0.04);
      if (current > 0) requestAnimationFrame(frame);
    }
  }

  function start(){
    holding = true;
    startTime = performance.now() - current * duration;
    requestAnimationFrame(frame);
  }
  function end(){
    holding = false;
    requestAnimationFrame(frame);
  }

  frameEl.addEventListener('mousedown', start);
  frameEl.addEventListener('touchstart', (e) => { e.preventDefault(); start(); }, { passive:false });
  ['mouseup','mouseleave'].forEach(ev => frameEl.addEventListener(ev, end));
  ['touchend','touchcancel'].forEach(ev => frameEl.addEventListener(ev, end));
}

/* =========================================================================
 * 6. initLocationCards(gridEl, items)
 *    カードデータの配列からロケーションカードを生成する。展開自体は
 *    CSS の max-height トランジション(hover)だけで完結させ、JS は
 *    データからDOMを組み立てる役割に限定している(使い回しやすくするため)。
 * ======================================================================= */
function initLocationCards(gridEl, items){
  gridEl.innerHTML = items.map((item, i) => `
    <div class="loc-card">
      <div>
        <div class="n">${String(i + 1).padStart(2, '0')}</div>
        <h3>${item.title}</h3>
      </div>
      <p>${item.body}</p>
    </div>
  `).join('');
}

/* ---------- 起動 ---------- */
initPreloader(() => {
  initParallax([
    { el: document.querySelector('#hero .layer.back'), speed: 0.15 },
    { el: document.querySelector('#hero .layer.mid'), speed: 0.35 },
  ]);
});

initChapterScroll();
initHoldCompare(document.getElementById('compareFrame'));
initLocationCards(document.getElementById('locGrid'), [
  { title: 'Yaremche', body: 'カルパティア山脈のふもとにある町。滝や渓谷へのアクセス拠点。' },
  { title: 'Hutsul Village', body: '伝統的な木造建築と手工芸が今も息づく山岳集落。' },
  { title: 'Prut River', body: '敷地のすぐそばを流れる川。夏はハイキング、冬はスキーの起点に。' },
  { title: 'Wellness Pavilion', body: '地元の木材と石を使ったスパ棟。四季を通じて利用できる屋外浴槽を併設。' },
]);
</script>
</body>
</html>
