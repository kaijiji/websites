<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ATLAS OS — 3D空間ナビゲーション「クリエイターOS」表現 再現デモ</title>
<meta name="description" content="Awwwards Site of the Day「Steven.com」(制作: OFF+BRAND.)の表現技法(複数の事業領域を3D空間のノードとして配置し、手描き風のラインで結んでカメラが空間内を飛び回るナビゲーション)を学習目的でオリジナル再現したデモ" />
<style>
  /* ============================================================
     このファイルは学習用のオリジナル再現デモです。
     Steven.com (https://www.steven.com/, 制作: OFF+BRAND.) の
     実際のソースコード・3Dモデル・シェーダー・文言・配色・ブランド名は
     一切使用していません。
     「複数の事業領域(パイロン)を3D空間内のノードとして配置し、
     手描き風のラインで結び、ノードを選ぶとカメラがその場所まで
     飛んでいく "空間的なOS" のようなナビゲーション」という、
     観察できる表現ジャンルだけを理解した上で、
     架空のプロダクト名・架空のノード構成・独自のカメラ実装で
     ゼロから再構築しています。
     ============================================================ */

  :root{
    --bg-0:#05060a;
    --bg-1:#0b0d16;
    --fg:#eef0fb;
    --fg-dim:#8a8fb0;
    --line:rgba(238,240,255,.10);
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; }
  body{
    background:radial-gradient(ellipse at 50% 30%, var(--bg-1), var(--bg-0) 70%);
    color:var(--fg);
    font-family:-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Arial,sans-serif;
    cursor:none;
  }
  @media (hover:none), (pointer:coarse){ body{ cursor:auto; } }

  canvas#scene{ position:fixed; inset:0; display:block; touch-action:none; }

  /* ---- カスタムカーソル ---- */
  .cur-dot,.cur-ring{
    position:fixed; top:0; left:0; pointer-events:none; z-index:9999;
    border-radius:50%; transform:translate(-50%,-50%); will-change:transform;
  }
  .cur-dot{ width:5px; height:5px; background:var(--fg); }
  .cur-ring{
    width:30px; height:30px; border:1px solid rgba(238,240,255,.45);
    transition:width .3s var(--ease),height .3s var(--ease),border-color .3s var(--ease),background .3s var(--ease);
  }
  .cur-ring.is-active{ width:64px; height:64px; border-color:transparent; background:rgba(238,240,255,.10); }
  @media (hover:none), (pointer:coarse){ .cur-dot,.cur-ring{ display:none; } }

  /* ---- ヘッダー ---- */
  header.top{
    position:fixed; top:0; left:0; right:0; z-index:40;
    display:flex; align-items:center; justify-content:space-between;
    padding:26px clamp(20px,4vw,48px);
  }
  header.top .logo{ font-weight:700; letter-spacing:.16em; font-size:13px; }
  header.top .logo b{ color:#7c8cff; }
  header.top .hint{
    font-size:11px; letter-spacing:.08em; color:var(--fg-dim);
    text-transform:uppercase; text-align:right;
  }

  /* ---- HUDピン(ノードのDOMラベル) ---- */
  #hud{ position:fixed; inset:0; pointer-events:none; z-index:20; }
  .pin{
    position:absolute; top:0; left:0;
    display:flex; align-items:center; gap:8px;
    background:none; border:0; padding:0; margin:0;
    pointer-events:auto; cursor:none;
    transform:translate(-9999px,-9999px);
  }
  .pin .dot{
    width:12px; height:12px; border-radius:50%;
    box-shadow:0 0 0 4px currentColor22, 0 0 18px 2px currentColor;
    background:currentColor;
    transition:transform .25s var(--ease);
  }
  .pin .label{
    font-size:11px; letter-spacing:.06em; white-space:nowrap;
    color:var(--fg); background:rgba(6,7,12,.55);
    border:1px solid var(--line); border-radius:999px;
    padding:5px 11px 5px 9px; backdrop-filter:blur(6px);
    opacity:0; transform:translateX(-6px);
    transition:opacity .25s var(--ease), transform .25s var(--ease);
  }
  .pin:hover .label, .pin.is-focused .label{ opacity:1; transform:translateX(0); }
  .pin:hover .dot, .pin.is-focused .dot{ transform:scale(1.35); }
  .pin.is-home .label{ font-weight:700; }

  /* ---- 詳細パネル(ノードにフォーカスした時にスライドイン) ---- */
  #panel{
    position:fixed; top:0; right:0; bottom:0; z-index:50;
    width:min(380px,86vw); padding:96px 34px 40px;
    background:linear-gradient(180deg, rgba(9,10,18,.92), rgba(9,10,18,.82));
    border-left:1px solid var(--line); backdrop-filter:blur(14px);
    transform:translateX(100%); transition:transform .6s var(--ease);
    display:flex; flex-direction:column; gap:16px;
  }
  #panel.is-open{ transform:translateX(0); }
  #panel .bar{ width:34px; height:4px; border-radius:2px; background:var(--accent-c,#7c8cff); }
  #panel .tag{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--fg-dim); }
  #panel h2{ margin:0; font-size:26px; line-height:1.3; }
  #panel p{ margin:0; font-size:13.5px; line-height:1.85; color:var(--fg-dim); }
  #panel .close{
    align-self:flex-start; margin-top:auto;
    display:flex; align-items:center; gap:8px;
    background:none; border:1px solid var(--line); color:var(--fg);
    font-size:12px; letter-spacing:.06em; padding:11px 18px; border-radius:999px;
    cursor:none; transition:border-color .3s var(--ease), background .3s var(--ease);
  }
  #panel .close:hover{ border-color:rgba(238,240,255,.5); background:rgba(255,255,255,.05); }

  /* ---- フッターの操作ヒント ---- */
  footer.tip{
    position:fixed; left:0; right:0; bottom:22px; z-index:30;
    text-align:center; font-size:11px; letter-spacing:.08em;
    color:var(--fg-dim); pointer-events:none;
  }
</style>
</head>
<body>

  <canvas id="scene"></canvas>

  <div class="cur-dot" id="curDot"></div>
  <div class="cur-ring" id="curRing"></div>

  <header class="top">
    <div class="logo">ATLAS<b>.</b>OS</div>
    <div class="hint">ドラッグで視点回転 &nbsp;/&nbsp; ホイールでズーム<br/>ノードをクリックしてフォーカス</div>
  </header>

  <div id="hud"></div>

  <aside id="panel">
    <div class="bar" id="panelBar"></div>
    <div class="tag" id="panelTag">PILLAR</div>
    <h2 id="panelTitle">—</h2>
    <p id="panelDesc">—</p>
    <button class="close" id="panelClose">◀ &nbsp;宇宙全体に戻る</button>
  </aside>

  <footer class="tip" id="tip">空間内に浮かぶノードが、このプロダクトを構成する領域を表しています</footer>

<script>
(function(){
  "use strict";

  /* ============================================================
   * 0. コンテンツ定義(架空のプロダクト構成)
   *    id / label(表示名) / tag(カテゴリ) / color / pos(3D座標)
   *    / desc(パネルに表示する説明文)
   * ============================================================ */
  var NODES = [
    { id:"home",  label:"HOME",       tag:"エントランス", color:"#eef0fb",
      pos:[0,0,0],
      desc:"すべてのノードにつながる中心。ここから空間全体を見渡し、各領域へ飛ぶことができます。" },
    { id:"media", label:"MEDIA",      tag:"発信",         color:"#ff6b5c",
      pos:[3.3,0.7,-1.3],
      desc:"番組・記事・映像など、プロダクトが外部に発信するコンテンツが集まる領域です。" },
    { id:"ventures", label:"VENTURES", tag:"事業",        color:"#5cc8ff",
      pos:[-3.1,-0.5,-2.0],
      desc:"新しく立ち上げた事業やプロジェクトの一覧。投資・協業の窓口もここにまとまっています。" },
    { id:"events", label:"EVENTS",    tag:"イベント",      color:"#ffd35c",
      pos:[1.9,2.5,2.5],
      desc:"カンファレンスやミートアップなど、リアルとオンラインの体験を横断して案内する場所です。" },
    { id:"tech",  label:"TECHNOLOGY", tag:"技術基盤",      color:"#7c5cff",
      pos:[-1.7,-2.3,2.7],
      desc:"プロダクトを支える開発ツールや基盤技術のショーケース。API・SDKもここから辿れます。" },
    { id:"community", label:"COMMUNITY", tag:"コミュニティ", color:"#5cff9c",
      pos:[2.7,-2.1,-2.3],
      desc:"メンバー同士がつながる場。フォーラムや相互紹介の仕組みがここに集約されています。" },
    { id:"studio", label:"STUDIO",   tag:"制作",          color:"#ff5ca8",
      pos:[-2.9,2.1,1.1],
      desc:"撮影・編集・配信を行う制作拠点。次の企画のためのリソースがまとめられています。" }
  ];

  // ハブ(home)から各ノードへの接続 + 関連の深い領域同士の横のつながり
  var EDGES = [
    ["home","media"], ["home","ventures"], ["home","events"],
    ["home","tech"], ["home","community"], ["home","studio"],
    ["media","events"], ["ventures","tech"], ["community","studio"]
  ];

  var nodeById = {};
  NODES.forEach(function(n){ nodeById[n.id] = n; });

  /* ============================================================
   * 1. ベクトル演算(vec3) — 外部ライブラリを使わない自前実装
   * ============================================================ */
  function sub(a,b){ return [a[0]-b[0], a[1]-b[1], a[2]-b[2]]; }
  function add(a,b){ return [a[0]+b[0], a[1]+b[1], a[2]+b[2]]; }
  function scl(a,s){ return [a[0]*s, a[1]*s, a[2]*s]; }
  function dot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
  function cross(a,b){
    return [ a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0] ];
  }
  function len(a){ return Math.sqrt(dot(a,a)); }
  function norm(a){ var l = len(a) || 1e-6; return [a[0]/l, a[1]/l, a[2]/l]; }
  function lerp(a,b,t){ return a + (b-a)*t; }
  function lerpVec(a,b,t){ return [lerp(a[0],b[0],t), lerp(a[1],b[1],t), lerp(a[2],b[2],t)]; }

  /* ============================================================
   * 2. 自作パースペクティブカメラ
   *    eye(視点)・target(注視点)から right/up/forward の3基底ベクトルを
   *    毎フレーム作り、ワールド座標を「カメラ空間」に変換してから
   *    透視投影(focal / z')で画面座標に落とす。
   * ============================================================ */
  var FOCAL = 1.6; // 値が大きいほど画角が狭い(望遠)寄りになる
  var camera = {
    eye:[0,0,9], target:[0,0,0],
    _basis:{ right:[1,0,0], up:[0,1,0], fwd:[0,0,-1] }
  };

  function updateBasis(){
    var fwd = norm(sub(camera.target, camera.eye));
    var right = norm(cross(fwd, [0,1,0]));
    var up = cross(right, fwd);
    camera._basis = { right:right, up:up, fwd:fwd };
  }

  // ワールド座標 p を画面座標 {x,y,scale,z} に投影する。z<=near は画面外(背後)。
  function project(p, width, height){
    var b = camera._basis;
    var rel = sub(p, camera.eye);
    var x = dot(rel, b.right);
    var y = dot(rel, b.up);
    var z = dot(rel, b.fwd);
    var near = 0.15;
    if (z <= near) return null;
    var half = Math.min(width, height) * 0.5;
    var sx = width/2  + (x / z) * FOCAL * half;
    var sy = height/2 - (y / z) * FOCAL * half;
    var scale = FOCAL * half / z; // 1ワールド単位が何pxに見えるか(奥行きスケール)
    return { x:sx, y:sy, z:z, scale:scale };
  }

  /* ============================================================
   * 3. オービット操作(ドラッグで回転・ホイールでズーム)
   *    + ノードにフォーカスした際の「視点を飛ばす」演出
   * ============================================================ */
  var orbit = { theta: 0.6, phi: 0.5, radius: 9.4 };
  var autoSpin = true;
  var focused = null; // フォーカス中のノード(nullなら宇宙全体を俯瞰)

  function sceneCenter(){ return [0,0,0]; }

  function desiredEyeTarget(){
    if (focused){
      // ノードの少し手前・少し上から、そのノードを見下ろす位置へ視点を飛ばす
      var toNode = norm(sub(focused.pos, sceneCenter()));
      var dist = 3.1;
      var eye = add(focused.pos, add(scl(toNode, dist), [0, 1.1, 0]));
      return { eye:eye, target:focused.pos };
    }
    var p = orbit.phi, t = orbit.theta, r = orbit.radius;
    var eye = [
      r * Math.cos(p) * Math.sin(t),
      r * Math.sin(p),
      r * Math.cos(p) * Math.cos(t)
    ];
    return { eye:eye, target:[0,0,0] };
  }

  /* ============================================================
   * 4. 手描き風の接続ライン
   *    各エッジごとに、両端点を結ぶ直線に対して垂直方向へ
   *    「ノードidから決まる疑似乱数」でオフセットした制御点を作り、
   *    2次ベジェ曲線としてなめらかな“配線”に見せる。
   *    同じ経路をわずかにずらして2回描くことで鉛筆の重ね書き感を出す。
   * ============================================================ */
  function hashSeed(str){
    var h = 2166136261;
    for (var i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = (h*16777619)>>>0; }
    return h;
  }
  function mulberry32(seed){
    return function(){
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var paths = EDGES.map(function(edge){
    var a = nodeById[edge[0]], b = nodeById[edge[1]];
    var rnd = mulberry32(hashSeed(edge[0]+"-"+edge[1]));
    var mid = lerpVec(a.pos, b.pos, 0.5);
    var dir = norm(sub(b.pos, a.pos));
    // 直線に垂直な適当な軸を2本作り、そちらへランダムにずらして「揺らぎ」を出す
    // (dirがY軸にほぼ平行な場合はX軸を、それ以外はY軸を基準ベクトルに使う)
    var refAxis = Math.abs(dir[1]) > 0.95 ? [1,0,0] : [0,1,0];
    var perp1 = norm(cross(dir, refAxis));
    var perp2 = cross(dir, perp1);
    var wobble = (rnd()-0.5) * 1.1;
    var wobble2 = (rnd()-0.5) * 0.7;
    var ctrl = add(mid, add(scl(perp1, wobble), scl(perp2, wobble2)));
    // 3次ベジェにするための2制御点(ctrl付近を少しばらけさせる)
    var c1 = lerpVec(a.pos, ctrl, 0.55 + (rnd()-0.5)*0.1);
    var c2 = lerpVec(b.pos, ctrl, 0.55 + (rnd()-0.5)*0.1);
    var seed = rnd() * 100; // 手描き二重線オフセットの位相をエッジごとにずらす数値シード
    return { a:a, b:b, c1:c1, c2:c2, seed:seed };
  });

  function bezierPoint(p0,p1,p2,p3,t){
    var u = 1-t;
    var w0 = u*u*u, w1 = 3*u*u*t, w2 = 3*u*t*t, w3 = t*t*t;
    return [
      p0[0]*w0 + p1[0]*w1 + p2[0]*w2 + p3[0]*w3,
      p0[1]*w0 + p1[1]*w1 + p2[1]*w2 + p3[1]*w3,
      p0[2]*w0 + p1[2]*w1 + p2[2]*w2 + p3[2]*w3
    ];
  }
  var SEGMENTS = 40;
  paths.forEach(function(p){
    p.samples = [];
    for (var i=0;i<=SEGMENTS;i++){
      p.samples.push(bezierPoint(p.a.pos, p.c1, p.c2, p.b.pos, i/SEGMENTS));
    }
  });

  function hexToRgb(hex){
    var v = parseInt(hex.slice(1),16);
    return [ (v>>16)&255, (v>>8)&255, v&255 ];
  }

  /* ============================================================
   * 5. 星屑の背景(静的パーティクル、視点にわずかに追従してパララックス)
   * ============================================================ */
  var stars = [];
  (function(){
    var rnd = mulberry32(42);
    for (var i=0;i<260;i++){
      stars.push({ x: rnd(), y: rnd(), r: rnd()*1.3+0.3, a: rnd()*0.5+0.2 });
    }
  })();

  /* ============================================================
   * 6. Canvas 描画本体
   * ============================================================ */
  var canvas = document.getElementById("scene");
  var ctx = canvas.getContext("2d");
  var W=0, H=0, DPR=1;

  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.style.width = W+"px";
    canvas.style.height = H+"px";
    canvas.width = W*DPR; canvas.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener("resize", resize);
  resize();

  function drawStars(t){
    ctx.save();
    var parX = Math.sin(orbit.theta)*10;
    var parY = orbit.phi*14;
    stars.forEach(function(s){
      var x = ((s.x*W - parX) % W + W) % W;
      var y = ((s.y*H - parY) % H + H) % H;
      ctx.globalAlpha = s.a * (0.7 + 0.3*Math.sin(t*0.0006 + s.x*20));
      ctx.fillStyle = "#eef0fb";
      ctx.beginPath();
      ctx.arc(x, y, s.r, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawEdges(){
    paths.forEach(function(p){
      var pts = p.samples.map(function(v){ return project(v, W, H); });
      if (pts.some(function(pp){ return !pp; })) return; // 一部が背後なら今回はスキップ
      var c0 = hexToRgb(p.a.color), c1 = hexToRgb(p.b.color);
      var grad = ctx.createLinearGradient(pts[0].x, pts[0].y, pts[pts.length-1].x, pts[pts.length-1].y);
      grad.addColorStop(0, "rgba("+c0[0]+","+c0[1]+","+c0[2]+",.85)");
      grad.addColorStop(1, "rgba("+c1[0]+","+c1[1]+","+c1[2]+",.85)");

      // 鉛筆の重ね書き風に、わずかにオフセットした2本を薄く重ねる
      [ -0.6, 0.6 ].forEach(function(off, idx){
        ctx.beginPath();
        pts.forEach(function(pp, i){
          var nx = pp.x + off * Math.sin(i*0.7 + p.seed*10);
          var ny = pp.y + off * Math.cos(i*0.6 + p.seed*10);
          if (i===0) ctx.moveTo(nx, ny); else ctx.lineTo(nx, ny);
        });
        ctx.strokeStyle = grad;
        ctx.globalAlpha = idx===0 ? 0.6 : 0.32;
        ctx.lineWidth = Math.max(0.8, 2.1 * (pts[Math.floor(pts.length/2)].scale/140));
        ctx.stroke();
      });
      ctx.globalAlpha = 1;
    });
  }

  function drawNodes(){
    // 奥から手前の順(z降順=遠い順)に描いて、手前のノードが正しく前面に来るようにする
    var projected = NODES.map(function(n){
      return { n:n, p: project(n.pos, W, H) };
    }).filter(function(o){ return o.p; });
    projected.sort(function(a,b){ return b.p.z - a.p.z; });

    projected.forEach(function(o){
      var n = o.n, p = o.p;
      var r = Math.max(3, 10 * (p.scale/140));
      var rgb = hexToRgb(n.color);
      var rgbStr = rgb.join(",");

      // 外側の淡いグロー
      var glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r*4.2);
      glow.addColorStop(0, "rgba("+rgbStr+",.55)");
      glow.addColorStop(1, "rgba("+rgbStr+",0)");
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(p.x, p.y, r*4.2, 0, Math.PI*2); ctx.fill();

      // 本体(球っぽく見せるための放射グラデーション)
      var body = ctx.createRadialGradient(p.x - r*0.35, p.y - r*0.35, r*0.1, p.x, p.y, r);
      body.addColorStop(0, "#ffffff");
      body.addColorStop(0.35, "rgba("+rgbStr+",1)");
      body.addColorStop(1, "rgba("+(rgb[0]*0.4|0)+","+(rgb[1]*0.4|0)+","+(rgb[2]*0.4|0)+",1)");
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI*2); ctx.fill();

      if (focused && focused.id === n.id){
        ctx.strokeStyle = "rgba(255,255,255,.9)";
        ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(p.x, p.y, r+6, 0, Math.PI*2); ctx.stroke();
      }
    });

    return projected;
  }

  /* ============================================================
   * 7. HUDピン(DOM)を投影座標に同期させる
   * ============================================================ */
  var hud = document.getElementById("hud");
  var pinEls = {};
  NODES.forEach(function(n){
    var btn = document.createElement("button");
    btn.className = "pin" + (n.id==="home" ? " is-home" : "");
    btn.style.color = n.color;
    btn.innerHTML = '<span class="dot"></span><span class="label">'+n.label+' <span style="opacity:.55">— '+n.tag+'</span></span>';
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      focusNode(n);
    });
    hud.appendChild(btn);
    pinEls[n.id] = btn;
  });

  function syncPins(projectedList){
    var map = {};
    projectedList.forEach(function(o){ map[o.n.id] = o; });
    NODES.forEach(function(n){
      var el = pinEls[n.id];
      var o = map[n.id];
      if (!o){ el.style.transform = "translate(-9999px,-9999px)"; return; }
      el.style.transform = "translate3d("+o.p.x+"px,"+o.p.y+"px,0)";
      el.classList.toggle("is-focused", !!(focused && focused.id===n.id));
    });
  }

  /* ============================================================
   * 8. フォーカスパネルの開閉
   * ============================================================ */
  var panel = document.getElementById("panel");
  var panelTag = document.getElementById("panelTag");
  var panelTitle = document.getElementById("panelTitle");
  var panelDesc = document.getElementById("panelDesc");
  var panelBar = document.getElementById("panelBar");
  var tip = document.getElementById("tip");

  function focusNode(n){
    focused = n;
    autoSpin = false;
    panelTag.textContent = n.tag.toUpperCase();
    panelTitle.textContent = n.label;
    panelDesc.textContent = n.desc;
    panelBar.style.background = n.color;
    panel.classList.add("is-open");
    tip.style.opacity = 0;
  }
  function unfocus(){
    focused = null;
    panel.classList.remove("is-open");
    tip.style.opacity = 1;
  }
  document.getElementById("panelClose").addEventListener("click", unfocus);

  /* ============================================================
   * 9. ドラッグでオービット回転 / ホイールでズーム
   *    (クリックとドラッグを、移動距離のしきい値で区別する)
   * ============================================================ */
  var drag = null;
  canvas.addEventListener("pointerdown", function(e){
    drag = { x:e.clientX, y:e.clientY, moved:false, theta0:orbit.theta, phi0:orbit.phi };
    autoSpin = false;
  });
  window.addEventListener("pointermove", function(e){
    if (!drag) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx)+Math.abs(dy) > 4) drag.moved = true;
    orbit.theta = drag.theta0 - dx * 0.005;
    orbit.phi = Math.max(-1.2, Math.min(1.2, drag.phi0 + dy * 0.005));
  });
  window.addEventListener("pointerup", function(e){
    if (drag && !drag.moved && focused && e.target === canvas){
      unfocus(); // 宇宙背景をクリックしたらフォーカス解除
    }
    drag = null;
  });
  canvas.addEventListener("wheel", function(e){
    e.preventDefault();
    orbit.radius = Math.max(5, Math.min(15, orbit.radius + e.deltaY*0.01));
  }, { passive:false });

  /* ============================================================
   * 10. カスタムカーソル
   * ============================================================ */
  (function(){
    var dotEl = document.getElementById("curDot");
    var ringEl = document.getElementById("curRing");
    var mouse = { x:innerWidth/2, y:innerHeight/2 };
    var ring = { x:mouse.x, y:mouse.y };
    window.addEventListener("pointermove", function(e){
      mouse.x = e.clientX; mouse.y = e.clientY;
      dotEl.style.transform = "translate("+mouse.x+"px,"+mouse.y+"px) translate(-50%,-50%)";
    });
    document.addEventListener("pointerover", function(e){
      if (e.target.closest && e.target.closest(".pin,button")) ringEl.classList.add("is-active");
    });
    document.addEventListener("pointerout", function(e){
      if (e.target.closest && e.target.closest(".pin,button")) ringEl.classList.remove("is-active");
    });
    (function tick(){
      ring.x += (mouse.x-ring.x)*0.18;
      ring.y += (mouse.y-ring.y)*0.18;
      ringEl.style.transform = "translate("+ring.x+"px,"+ring.y+"px) translate(-50%,-50%)";
      requestAnimationFrame(tick);
    })();
  })();

  /* ============================================================
   * 11. メインループ
   * ============================================================ */
  var CAM_LERP = 0.06;
  function frame(t){
    if (autoSpin && !drag) orbit.theta += 0.0011;

    var d = desiredEyeTarget();
    camera.eye = lerpVec(camera.eye, d.eye, CAM_LERP);
    camera.target = lerpVec(camera.target, d.target, CAM_LERP);
    updateBasis();

    ctx.clearRect(0,0,W,H);
    drawStars(t);
    drawEdges();
    var projectedNodes = drawNodes();
    syncPins(projectedNodes);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
